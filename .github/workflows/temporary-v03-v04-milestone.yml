name: One-time v0.3-v0.4 milestone setup
on:
  push:
    branches: [v0.3-v0.4-context-graph]

permissions:
  issues: write
  pull-requests: write

jobs:
  milestone:
    if: startsWith(github.event.head_commit.message, 'chore: setup one-time release milestone')
    runs-on: ubuntu-latest
    steps:
      - name: Create milestone and assign tracking issues
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "v0.3 + v0.4 — Context Node Editor & Executable Workflow";
            const description = [
              "Joint v0.3/v0.4 implementation and release milestone.",
              "v0.3 #11–#19 implemented and closed; v0.4 #20–#23 remain open",
              "pending real authenticated Windows Codex App Server and Desktop verification.",
              "Source: PR #24. Merging code to main does not imply live-runtime acceptance."
            ].join("\n");
            const existing = await github.paginate(github.rest.issues.listMilestones, {
              owner, repo, state: "all", per_page: 100
            });
            let milestone = existing.find(m => m.title === title);
            if (!milestone) {
              const made = await github.rest.issues.createMilestone({
                owner, repo, title, description, state: "open"
              });
              milestone = made.data;
              core.info("Created milestone: " + milestone.html_url);
            } else {
              core.info("Reusing milestone: " + milestone.html_url);
            }
            for (let issue_number = 10; issue_number <= 24; issue_number++) {
              const updated = await github.rest.issues.update({
                owner, repo, issue_number, milestone: milestone.number
              });
              core.info("Assigned #" + issue_number + " to milestone #" + milestone.number);
            }
            core.info("MILESTONE_URL=" + milestone.html_url);
